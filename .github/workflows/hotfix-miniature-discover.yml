name: Hotfix Miniatures Army UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor == 'github-actions[bot]' || github.event.head_commit.author.username == 'janiperta-debug' || github.event.head_commit.author.name == 'Jani Perta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale Miniatures Army UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/discover-games.tsx')
          text = path.read_text()

          start = '            {selectedCategory === "miniature" && armyMode !== "idle" && (\n'
          end = '            <div className={`flex flex-col sm:flex-row justify-end gap-2 sm:gap-3 mt-4 ${selectedCategory !== "trading_card" && selectedCategory !== "miniature" ? "pt-4 border-t border-accent-gold/20" : ""}`}>\n'

          if start not in text or end not in text:
              raise SystemExit('Expected Miniatures Army UI block not found')

          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          text = before + end + after
          text = text.replace('disabled={addingGame !== null || (selectedCategory === "miniature" && armyMode !== "idle" && !selectedArmy)}', 'disabled={addingGame !== null}')

          path.write_text(text)
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/discover-games.tsx
          git rm .github/workflows/hotfix-miniature-discover.yml
          git commit -m "WP-004D: remove stale Miniatures Army UI"
          git push